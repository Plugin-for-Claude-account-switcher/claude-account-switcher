<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}} 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';"
  />
  <title>Claude Chat</title>
  <style nonce="{{nonce}}">
    /* ── Reset & Variables ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: var(--vscode-sideBar-background, #1e1e1e);
      --fg: var(--vscode-sideBar-foreground, #cccccc);
      --input-bg: var(--vscode-input-background, #3c3c3c);
      --input-fg: var(--vscode-input-foreground, #cccccc);
      --input-border: var(--vscode-input-border, transparent);
      --btn-bg: var(--vscode-button-background, #0e639c);
      --btn-fg: var(--vscode-button-foreground, #ffffff);
      --btn-hover: var(--vscode-button-hoverBackground, #1177bb);
      --border: var(--vscode-widget-border, #454545);
      --user-bubble: var(--vscode-inputOption-activeBackground, #0e639c33);
      --asst-bubble: var(--vscode-editor-inactiveSelectionBackground, #3a3d41);
      --error-fg: var(--vscode-errorForeground, #f48771);
      --badge-api-bg: #0e639c;
      --badge-pro-bg: #6f42c1;
      --font: var(--vscode-font-family, system-ui, -apple-system, sans-serif);
      --font-mono: var(--vscode-editor-font-family, 'Cascadia Code', 'Consolas', monospace);
      --radius: 8px;
      --gap: 8px;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      font-size: var(--vscode-font-size, 13px);
      color: var(--fg);
      background: var(--bg);
      overflow: hidden;
    }

    /* ── Layout ────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header / badge ─────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #header-title {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    #mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: var(--badge-api-bg);
      transition: background 0.2s;
      user-select: none;
    }

    #mode-badge.pro { background: var(--badge-pro-bg); }

    #mode-badge::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      flex-shrink: 0;
    }

    /* ── Messages ──────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .bubble-row {
      display: flex;
      flex-direction: column;
      max-width: 92%;
    }

    .bubble-row.user { align-self: flex-end; align-items: flex-end; }
    .bubble-row.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble-label {
      font-size: 10px;
      opacity: 0.5;
      margin-bottom: 3px;
      letter-spacing: 0.03em;
    }

    .bubble {
      padding: 8px 12px;
      border-radius: var(--radius);
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      background: var(--user-bubble);
      border: 1px solid var(--btn-bg);
    }

    .bubble.assistant {
      background: var(--asst-bubble);
      border: 1px solid var(--border);
    }

    .bubble.error {
      background: #3a1818;
      border: 1px solid var(--error-fg);
      color: var(--error-fg);
    }

    /* ── Typing indicator ──────────────────────────────────────────── */
    #typing {
      display: none;
      align-self: flex-start;
      padding: 10px 14px;
      background: var(--asst-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    #typing.visible { display: flex; gap: 4px; align-items: center; }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--fg);
      opacity: 0.4;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Empty state ──────────────────────────────────────────────── */
    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100%;
      opacity: 0.45;
      text-align: center;
      padding: 20px;
      pointer-events: none;
    }

    #empty svg { width: 36px; height: 36px; }

    #empty p { font-size: 12px; line-height: 1.6; }

    /* ── Input area ───────────────────────────────────────────────── */
    #footer {
      padding: 8px 10px 10px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #input-row {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      background: var(--input-bg);
      color: var(--input-fg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      padding: 7px 10px;
      font-family: var(--font);
      font-size: inherit;
      resize: none;
      min-height: 36px;
      max-height: 140px;
      outline: none;
      line-height: 1.5;
      overflow-y: auto;
    }

    #input:focus { border-color: var(--btn-bg); }

    #input::-webkit-scrollbar { width: 3px; }
    #input::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--btn-bg);
      color: var(--btn-fg);
      border: none;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, opacity 0.15s;
    }

    .icon-btn:hover { background: var(--btn-hover); }
    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .icon-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
    }

    .icon-btn.secondary:hover { background: var(--asst-bubble); }

    #hint {
      margin-top: 5px;
      font-size: 10px;
      opacity: 0.4;
      text-align: right;
    }

    /* ── Code blocks inside messages ──────────────────────────────── */
    .bubble code {
      font-family: var(--font-mono);
      font-size: 0.92em;
      background: rgba(0,0,0,0.25);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .bubble pre {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      margin-top: 6px;
      font-family: var(--font-mono);
      font-size: 0.9em;
      line-height: 1.5;
    }

    .bubble pre code {
      background: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <div id="header">
      <span id="header-title">Claude Chat</span>
      <span id="mode-badge">API</span>
    </div>

    <!-- Messages -->
    <div id="messages">
      <div id="empty">
        <!-- Claude logo simplified -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M13 20 Q20 10 27 20 Q20 30 13 20Z" fill="currentColor" opacity="0.6"/>
        </svg>
        <p>Ask Claude anything.<br/>Your conversation stays local.</p>
      </div>
      <div id="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

    <!-- Footer / Input -->
    <div id="footer">
      <div id="input-row">
        <textarea
          id="input"
          placeholder="Message Claude… (Shift+Enter for newline)"
          rows="1"
          spellcheck="true"
          autocomplete="off"
        ></textarea>
        <button id="send-btn" class="icon-btn" title="Send (Enter)">
          <!-- Send icon -->
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M.5 1.163A1 1 0 0 1 1.97.28l12.868 6.837a1 1 0 0 1 0 1.766L1.969 15.72A1 1 0 0 1 .5 14.836V10.33a1 1 0 0 1 .816-.983L8.5 8 1.316 6.653A1 1 0 0 1 .5 5.67V1.163z"/>
          </svg>
        </button>
        <button id="clear-btn" class="icon-btn secondary" title="Clear conversation">
          <!-- Trash icon -->
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
            <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
          </svg>
        </button>
      </div>
      <div id="hint">Enter to send · Shift+Enter for newline</div>
    </div>
  </div>

  <script nonce="{{nonce}}">
    (function () {
      'use strict';

      const vscode = acquireVsCodeApi();

      // ── State ──────────────────────────────────────────────────────
      let streaming = false;
      let currentMode = '{{initialMode}}';

      // ── DOM refs ───────────────────────────────────────────────────
      const messagesEl = document.getElementById('messages');
      const typingEl   = document.getElementById('typing');
      const emptyEl    = document.getElementById('empty');
      const inputEl    = document.getElementById('input');
      const sendBtn    = document.getElementById('send-btn');
      const clearBtn   = document.getElementById('clear-btn');
      const badgeEl    = document.getElementById('mode-badge');

      // ── Badge ──────────────────────────────────────────────────────
      function updateBadge(mode) {
        currentMode = mode;
        if (mode === 'pro') {
          badgeEl.textContent = 'Pro';
          badgeEl.className = 'pro';
        } else {
          badgeEl.textContent = 'API';
          badgeEl.className = '';
        }
      }
      updateBadge(currentMode);

      // ── Auto-resize textarea ───────────────────────────────────────
      function resizeInput() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
      }
      inputEl.addEventListener('input', resizeInput);

      // ── Send ───────────────────────────────────────────────────────
      function sendMessage() {
        const text = inputEl.value.trim();
        if (!text || streaming) return;
        inputEl.value = '';
        resizeInput();
        vscode.postMessage({ type: 'send', text });
      }

      inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      sendBtn.addEventListener('click', sendMessage);

      clearBtn.addEventListener('click', () => {
        if (streaming) return;
        vscode.postMessage({ type: 'clear' });
      });

      // ── Render helpers ─────────────────────────────────────────────
      function hideEmpty() {
        emptyEl.style.display = 'none';
      }

      function appendBubble(role, text) {
        const row = document.createElement('div');
        row.className = `bubble-row ${role}`;

        const label = document.createElement('div');
        label.className = 'bubble-label';
        label.textContent = role === 'user' ? 'You' : 'Claude';

        const bubble = document.createElement('div');
        bubble.className = `bubble ${role}`;
        bubble.innerHTML = renderMarkdown(text);

        row.appendChild(label);
        row.appendChild(bubble);
        messagesEl.insertBefore(row, typingEl);
        scrollBottom();
        return bubble;
      }

      function appendError(text) {
        const row = document.createElement('div');
        row.className = 'bubble-row assistant';

        const label = document.createElement('div');
        label.className = 'bubble-label';
        label.textContent = 'Error';

        const bubble = document.createElement('div');
        bubble.className = 'bubble error';
        bubble.textContent = text;

        row.appendChild(label);
        row.appendChild(bubble);
        messagesEl.insertBefore(row, typingEl);
        scrollBottom();
      }

      function scrollBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      function setStreaming(on) {
        streaming = on;
        sendBtn.disabled = on;
        clearBtn.disabled = on;
        inputEl.disabled = on;
        if (on) {
          typingEl.classList.add('visible');
          scrollBottom();
        } else {
          typingEl.classList.remove('visible');
        }
      }

      // ── Minimal Markdown renderer ──────────────────────────────────
      // Handles: **bold**, *italic*, `code`, ```blocks```, line breaks
      function renderMarkdown(text) {
        // Escape HTML first
        let safe = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // Code blocks (``` ... ```)
        safe = safe.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
          `<pre><code>${code.trimEnd()}</code></pre>`
        );

        // Inline code
        safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');

        // Bold
        safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

        // Italic
        safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');

        // Line breaks (preserve \n outside of pre blocks)
        safe = safe.replace(/\n/g, '<br/>');

        return safe;
      }

      // ── Streaming assistant message ────────────────────────────────
      let activeBubble = null;
      let accumulatedText = '';

      // ── Messages from extension ────────────────────────────────────
      window.addEventListener('message', event => {
        const msg = event.data;

        switch (msg.type) {
          case 'modeChanged':
            updateBadge(msg.mode);
            break;

          case 'userMessage':
            hideEmpty();
            appendBubble('user', msg.text);
            break;

          case 'assistantStart':
            accumulatedText = '';
            activeBubble = null;
            setStreaming(true);
            break;

          case 'assistantDelta':
            if (!activeBubble) {
              typingEl.classList.remove('visible');
              activeBubble = appendBubble('assistant', '');
            }
            accumulatedText += msg.text;
            activeBubble.innerHTML = renderMarkdown(accumulatedText);
            scrollBottom();
            break;

          case 'assistantDone':
            activeBubble = null;
            accumulatedText = '';
            setStreaming(false);
            scrollBottom();
            break;

          case 'error':
            setStreaming(false);
            activeBubble = null;
            accumulatedText = '';
            hideEmpty();
            appendError(msg.text);
            break;

          case 'cleared':
            // Remove all bubble rows
            const rows = messagesEl.querySelectorAll('.bubble-row');
            rows.forEach(r => r.remove());
            emptyEl.style.display = '';
            break;
        }
      });

      // Tell the extension we're ready
      vscode.postMessage({ type: 'ready' });
    })();
  </script>
</body>
</html>
